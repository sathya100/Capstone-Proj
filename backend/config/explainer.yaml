# RAG explainer settings (FR-11–13, NFR-09, NFR-10).
# Environment overrides: RXGUARD_LLM_PROVIDER, RXGUARD_LLM_MODEL.

# auto       -> gemini if GEMINI_API_KEY is set, else groq if GROQ_API_KEY is set, else extractive
# gemini     -> Google AI Studio free tier (GEMINI_API_KEY)
# groq       -> Groq free tier (GROQ_API_KEY)
# ollama     -> local model via Ollama (OLLAMA_HOST, default http://localhost:11434)
# extractive -> no LLM: quotes the label sentences that name the other drug, each cited
provider: auto

# Model names change often; check the provider's model list before your demo.
models:
  gemini: gemini-2.5-flash
  groq: llama-3.3-70b-versatile
  ollama: llama3.1:8b

# auto -> ChromaDB + all-MiniLM-L6-v2 if requirements-rag.txt is installed and the index is built,
#         otherwise TF-IDF over the same passages (no model download)
retriever: auto

top_k: 6            # passages given to the LLM
min_per_drug: 2     # at least this many from each drug's label
timeout_seconds: 20
cache: true         # reuse LLM explanations per drug pair (data/cache/explanations.json)
